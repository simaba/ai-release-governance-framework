[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-release-governance"
version = "0.1.0"
description = "Operational tooling for an AI release governance framework."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["gate_policy", "governance_cli", "risk_scoring"]
